
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Little World</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff4f8;
      color: #654456;
      text-align: center;
    }

    header {
      padding: 35px 15px;
      background: #f8c9dc;
      border-radius: 0 0 30px 30px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .welcome {
      margin: 25px 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 15px;
      max-width: 650px;
      margin: auto;
    }

    .item {
      background: white;
      padding: 24px 10px;
      border-radius: 20px;
      box-shadow: 0 3px 12px #eacbd8;
      font-size: 16px;
    }

    .emoji {
      display: block;
      font-size: 32px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Little World 💗</h1>
    <p>A little world made just for me</p>
  </header>

  <div class="welcome">
    <h2>Welcome to my world 🎀</h2>
    <p>Everything I love, in one place.</p>
  </div>

  <div class="grid">
    <div class="item"><span class="emoji">📔</span>My Secret Diary</div>
    <div class="item"><span class="emoji">📸</span>My Memories</div>
    <div class="item"><span class="emoji">📚</span>My School</div>
    <div class="item"><span class="emoji">💗</span>My Mood</div>
    <div class="item"><span class="emoji">❤️</span>Love Corner</div>
    <div class="item"><span class="emoji">🎵</span>My Music</div>
    <div class="item"><span class="emoji">⏳</span>Countdown</div>
    <div class="item"><span class="emoji">🌐</span>My Languages</div>
    <div class="item"><span class="emoji">🎮</span>My Games</div>
    <div class="item"><span class="emoji">🤖</span>My AI</div>
  </div>

</body>
</html>
